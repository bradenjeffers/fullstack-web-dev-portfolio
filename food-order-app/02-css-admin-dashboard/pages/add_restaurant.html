<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Restaurant - Food Order Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <nav aria-label="Admin">
      <ul>
        <li><a href="../index.html">Dashboard</a></li>
        <li><a href="list_fooditems.html">Food items</a></li>
        <li><a href="list_cuisines.html">Cuisines</a></li>
        <li><a href="list_categories.html">Categories</a></li>
        <li><a href="list_restaurants.html" aria-current="page">Restaurants</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Add Restaurant</h1>
    <form id="addRestaurantForm" action="#" method="get">
      <fieldset>
        <legend>Restaurant details</legend>
        <div class="field">
          <label for="name">Restaurant name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <textarea id="address" name="address" rows="3" required></textarea>
        </div>
        <div class="field">
          <label for="contact">Contact number</label>
          <input type="tel" id="contact" name="contact" inputmode="tel">
        </div>
        <div class="field">
          <label for="image">Image URL</label>
          <input type="url" id="image" name="image" placeholder="https://..." required>
        </div>
      </fieldset>
      <div class="form-actions">
        <button type="reset" class="secondary">Discard</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </main>
</body>
</html>
