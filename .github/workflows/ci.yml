name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript-practice:
    name: JavaScript practice (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the tests in each exercise folder
        run: |
          for d in 01-basics-conditionals-loops 02-functions-closures-this 03-data-structures 05-es6-oop-recipe-book 08-advanced-js-auth-and-fetch; do
            echo "::group::$d"
            (cd "javascript-practice/$d" && node --test) || exit 1
            echo "::endgroup::"
          done

  node-http-api:
    name: 05 Node HTTP API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-order-app/05-node-http-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  react-frontend:
    name: 03 React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-order-app/03-react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"

  react-redux-frontend:
    name: 04 React + Redux frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-order-app/04-react-redux-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"

  express-mongodb-api:
    name: 06 Express + MongoDB API
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: food-order-app/06-express-mongodb-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        env:
          TEST_DATABASE_URI: mongodb://127.0.0.1:27017/food_order_app_test
