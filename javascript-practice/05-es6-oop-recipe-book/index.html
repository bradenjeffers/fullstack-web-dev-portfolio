<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A recipe book built with ES6 classes: add, edit and delete recipes, saved in your browser.">
  <title>Recipe Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Recipe Book</h1>

    <form id="recipe-form" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a Recipe</h2>

      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Recipe title" maxlength="80" required>

      <label for="ingredients">Ingredients</label>
      <input type="text" id="ingredients" placeholder="Comma-separated, e.g. flour, eggs, milk" required>

      <label for="instructions">Instructions</label>
      <textarea id="instructions" rows="4" placeholder="Preparation instructions" required></textarea>

      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

      <div class="form-actions">
        <button type="submit" id="add-recipe-btn">Add Recipe</button>
        <button type="button" id="cancel-edit-btn" class="secondary" hidden>Cancel</button>
      </div>
    </form>

    <section id="recipe-list" aria-labelledby="recipes-heading">
      <h2 id="recipes-heading">Recipes</h2>
      <ul id="recipes"></ul>
    </section>
  </main>

  <script src="recipe-book.js"></script>
  <script src="script.js"></script>
</body>
</html>
