<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Order - Browse</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/config.js" defer></script>
  <script src="../js/auth-core.js" defer></script>
  <script src="../js/catalog.js" defer></script>
  <script src="../js/app.js" defer></script>
</head>
<body data-page="home">
  <header class="topbar">
    <span id="welcome"></span>
    <button type="button" id="logout-button">Log out</button>
  </header>

  <main>
    <section aria-labelledby="cuisines-heading">
      <h2 id="cuisines-heading">Try a new cuisine</h2>
      <div id="cuisine-list" class="items-container"></div>
    </section>

    <section aria-labelledby="categories-heading">
      <h2 id="categories-heading">Get inspiration for your order</h2>
      <div id="category-list" class="items-container"></div>
    </section>

    <section aria-labelledby="restaurants-heading">
      <h2 id="restaurants-heading">Available restaurants</h2>
      <div id="restaurant-list" class="items-container"></div>
    </section>
  </main>
</body>
</html>
