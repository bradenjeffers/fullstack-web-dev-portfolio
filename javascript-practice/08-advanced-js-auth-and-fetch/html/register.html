<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Food Order</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/auth-core.js" defer></script>
  <script src="../js/app.js" defer></script>
</head>
<body data-page="register">
  <main>
    <h1>Register</h1>
    <form id="registerForm" class="auth-form">
      <label for="fullname">Full name</label>
      <input type="text" id="fullname" name="fullname" autocomplete="name" required>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="30" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="contact">Phone number</label>
      <input type="tel" id="contact" name="contact" autocomplete="tel" required>

      <label for="password">Password (8+ characters)</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>

      <button type="submit">Create account</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p>Already registered? <a href="signin.html">Sign in</a></p>
    </form>
  </main>
</body>
</html>
